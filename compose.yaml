name: chronograph

x-app: &app
  image: chronograph:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://history:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/history
    S3_ENDPOINT: http://storage:9000

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: history
      POSTGRES_USER: history
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U history -d history]
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: public.ecr.aws/y9w4h2u9/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
    volumes: [storage:/data]
    ports: ["127.0.0.1:${S3_PORT:-9000}:9000"]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 3s
      retries: 30

  storage-init:
    image: public.ecr.aws/y9w4h2u9/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      storage: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://storage:9000 "$$ACCESS_KEY" "$$SECRET_KEY"
        mc mb --ignore-existing "local/$$BUCKET"
        mc anonymous set none "local/$$BUCKET"
    environment:
      ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      BUCKET: ${S3_BUCKET:-history-pdfs}

  migrate:
    <<: *app
    command: [npm, run, "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    restart: unless-stopped

  worker:
    <<: *app
    command: [npm, run, worker]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    profiles: [https]
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      PILOT_DOMAIN: ${PILOT_DOMAIN:-localhost}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data"]

volumes:
  postgres:
  storage:
  caddy:
